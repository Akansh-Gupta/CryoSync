<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .title{font:700 28px Arial;fill:#0f172a}.sub{font:16px Arial;fill:#475569}.head{font:700 15px Arial;fill:#0f172a}.text{font:14px Arial;fill:#334155}.line{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5}.msg{stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrow)}.return{stroke:#16a34a;stroke-width:2;fill:none;stroke-dasharray:6 4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="820" fill="#f8fafc"/>
  <text x="50" y="48" class="title">CRYOSYNC - Runtime Sequence</text>
  <text x="50" y="76" class="sub">From simulation input to dashboard and API output</text>

  <rect x="70" y="110" width="190" height="55" rx="10" fill="#bae6fd"/><text x="125" y="144" class="head">Operator</text>
  <rect x="330" y="110" width="190" height="55" rx="10" fill="#bbf7d0"/><text x="382" y="144" class="head">run_twin.py</text>
  <rect x="590" y="110" width="190" height="55" rx="10" fill="#fde68a"/><text x="642" y="144" class="head">run_pipeline.py</text>
  <rect x="850" y="110" width="190" height="55" rx="10" fill="#fbcfe8"/><text x="895" y="144" class="head">Data files</text>
  <rect x="1110" y="110" width="190" height="55" rx="10" fill="#ddd6fe"/><text x="1152" y="144" class="head">API / Dashboard</text>

  <path d="M165 165 L165 750" class="line"/><path d="M425 165 L425 750" class="line"/><path d="M685 165 L685 750" class="line"/><path d="M945 165 L945 750" class="line"/><path d="M1205 165 L1205 750" class="line"/>

  <path d="M165 220 L425 220" class="msg"/><text x="250" y="210" class="text">Start simulation</text>
  <path d="M425 275 L945 275" class="msg"/><text x="590" y="265" class="text">Generate weather, occupancy, loads, renewables, battery, diesel</text>
  <path d="M945 330 L425 330" class="return"/><text x="565" y="320" class="text">Save master_dataset.csv</text>
  <path d="M165 385 L685 385" class="msg"/><text x="350" y="375" class="text">Run analytics pipeline</text>
  <path d="M685 440 L945 440" class="msg"/><text x="735" y="430" class="text">Forecast + optimize + detect + score + alert</text>
  <path d="M945 495 L685 495" class="return"/><text x="735" y="485" class="text">Save output CSV files</text>
  <path d="M1205 550 L945 550" class="msg"/><text x="1010" y="540" class="text">Read CSV outputs</text>
  <path d="M945 605 L1205 605" class="return"/><text x="1010" y="595" class="text">Charts, metrics, alerts, API JSON</text>
  <path d="M165 660 L1205 660" class="msg"/><text x="570" y="650" class="text">Review station state and decisions</text>

  <rect x="250" y="725" width="1000" height="45" rx="10" fill="#e2e8f0"/><text x="490" y="753" class="text">Optional: API startup syncs readings and forecasts into SQLite/PostgreSQL</text>
</svg>